<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sky: #050c1a; --card: rgba(255,255,255,0.04); --card-b: rgba(255,255,255,0.08);
    --sun: #FFB830; --sun2: #FF8000; --acc: #00D4FF;
    --txt: #e2e8f4; --dim: #6b82a0; --dim2: #3a5070;
    --good: #4ADE80; --warn: #FB923C; --bad: #F87171;
  }
  body {
    background: linear-gradient(160deg, var(--sky) 0%, #0a1628 60%, #0d1f3c 100%);
    color: var(--txt); font-family: 'DM Mono', monospace;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 28px 16px;
  }
  .wrap { width: 100%; max-width: 500px; }
  .card { background: var(--card); border: 1px solid var(--card-b); border-radius: 14px; }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 22px; }
  .sun-wrap { position: relative; width: 58px; height: 58px; margin: 0 auto 11px; }
  .sun-rays { position: absolute; inset: 0; animation: spin 20s linear infinite; }
  .sun-core {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle, #FFE566 0%, #FFB830 55%, #FF8000 100%);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 10px rgba(255,184,48,.5); }
    50%      { box-shadow: 0 0 22px rgba(255,184,48,.9); }
  }
  h1 { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; }
  h1 span { color: var(--sun); }
  .subtitle { font-size: 0.62rem; color: var(--dim2); letter-spacing: 0.13em; text-transform: uppercase; margin-top: 4px; }

  /* ── Info strips ── */
  .strips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .strip { border-radius: 12px; padding: 10px 12px; }
  .strip-blue { background: rgba(0,212,255,0.04); border: 1px solid rgba(0,212,255,0.1); }
  .strip-green { background: rgba(74,222,128,0.04); border: 1px solid rgba(74,222,128,0.1); }
  .strip-head { font-size: 0.52rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 7px; opacity: 0.75; }
  .strip-blue .strip-head { color: var(--acc); }
  .strip-green .strip-head { color: var(--good); }
  .strip-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .strip-row span:first-child { font-size: 0.6rem; color: var(--dim2); }
  .strip-row span:last-child { font-size: 0.6rem; }
  .strip-blue .strip-row span:last-child { color: #7aaac8; }
  .strip-green .strip-row span:last-child { color: var(--good); }
  .orange { color: var(--warn) !important; }

  /* ── Refresh button ── */
  #refreshBtn {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: linear-gradient(135deg, var(--sun), var(--sun2));
    border: none; border-radius: 11px; color: #0a0f1e;
    font-family: 'DM Mono', monospace; font-size: 0.8rem;
    font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(255,184,48,0.18);
  }
  #refreshBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,184,48,0.4); }
  #refreshBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── Error ── */
  #errorBox {
    display: none; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2); border-radius: 11px;
    padding: 11px 14px; font-size: 0.74rem; color: #fca5a5; margin-bottom: 12px;
  }

  /* ── Day strip ── */
  #dayStrip { display: none; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 12px; }
  .day-btn {
    padding: 7px 3px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; transition: all 0.15s;
  }
  .day-btn:hover { transform: translateY(-2px); }
  .day-btn.active { /* set dynamically */ }
  .day-btn .db-name { font-size: 0.52rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim2); }
  .day-btn .db-icon { font-size: 1rem; margin: 2px 0 1px; }
  .day-btn .db-kwh  { font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700; color: #7a90b0; }
  .day-btn .db-unit { font-size: 0.46rem; color: var(--dim2); }

  /* ── Day detail ── */
  #dayDetail { display: none; animation: fadeUp 0.35s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .banner {
    background: linear-gradient(135deg,rgba(255,184,48,0.08),rgba(255,128,0,0.03));
    border: 1px solid rgba(255,184,48,0.15); border-radius: 13px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .banner-label { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); margin-bottom: 2px; }
  .banner-date  { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; }
  .banner-right { text-align: right; }
  .banner-icon  { font-size: 1.4rem; }
  .banner-cond  { font-size: 0.68rem; color: #7a90b0; margin-top: 1px; }
  .banner-rain  { font-size: 0.62rem; color: #7dd3fc; }

  .big-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .big-stat { padding: 16px; }
  .big-stat-icon  { font-size: 1.1rem; margin-bottom: 6px; }
  .big-stat-label { font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
  .big-stat-val   { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; line-height: 1; }
  .big-stat-unit  { font-size: 0.62rem; color: var(--dim2); margin-top: 3px; }
  .col-sun { color: var(--sun); }
  .col-acc { color: var(--acc); }

  .rating-card { padding: 15px; margin-bottom: 8px; }
  .rating-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .rating-lbl { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .rating-badge { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.74rem; padding: 3px 10px; border-radius: 20px; }
  .bar-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(.34,1.56,.64,1); }

  .hourly-card { padding: 15px; margin-bottom: 8px; }
  .hourly-lbl { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .chart-bar {
    width: 100%; min-height: 2px; border-radius: 2px 2px 0 0;
    transform-origin: bottom; animation: barIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .chart-time { font-size: 0.43rem; color: var(--dim2); margin-top: 2px; white-space: nowrap; }

  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .detail-item { padding: 11px 13px; display: flex; align-items: center; gap: 9px; }
  .detail-icon { font-size: 0.95rem; opacity: 0.7; }
  .detail-lbl  { font-size: 0.54rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim2); }
  .detail-val  { font-size: 0.83rem; font-weight: 500; margin-top: 2px; }

  .footer { text-align: center; font-size: 0.54rem; color: #1a3050; margin-top: 18px; }

  /* Loading dots */
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: rgba(10,15,30,0.5); animation: pdot 1.1s ease-in-out infinite; margin: 0 2px; }
  @keyframes pdot { 0%,100%{opacity:.2} 50%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="sun-wrap">
      <svg class="sun-rays" width="58" height="58" viewBox="0 0 58 58">
        <line x1="29" y1="3"  x2="29" y2="11" stroke="rgba(255,184,48,0.4)" stroke-width="2" stroke-linecap="round"/>
        <line x1="29" y1="3"  x2="29" y2="11" stroke="rgba(255,184,48,0.4)" stroke-width="2" stroke-linecap="round" transform="rotate(45 29 29)"/>
        <line x1="29" y1="3"  x2="29" y2="11" stroke="rgba(255,184,48,0.4)" stroke-width="2" stroke-linecap="round" transform="rotate(90 29 29)"/>
        <line x1="29" y1="3"  x2="29" y2="11" stroke="rgba(255,184,48,0.4)" stroke-width="2" stroke-linecap="round" transform="rotate(135 29 29)"/>
      </svg>
      <div class="sun-core"></div>
    </div>
    <h1>Solar <span>Forecast</span></h1>
    <p class="subtitle">7-Day · Open-Meteo</p>
  </div>

  <!-- Info strips -->
  <div class="strips">
    <div class="strip strip-blue">
      <div class="strip-head">System</div>
      <div class="strip-row"><span>Panels</span><span>11× AIKO A480</span></div>
      <div class="strip-row"><span>Power</span><span>5.28 kW</span></div>
      <div class="strip-row"><span>Efficiency</span><span>24.0% N-ABC</span></div>
      <div class="strip-row"><span>Orientation</span><span class="orange">⚠ South-facing</span></div>
    </div>
    <div class="strip strip-green">
      <div class="strip-head">✓ Calibrated</div>
      <div class="strip-row"><span>27 May</span><span>4.80 kWh</span></div>
      <div class="strip-row"><span>28 May</span><span>6.30 kWh</span></div>
      <div class="strip-row"><span>29 May</span><span>5.10 kWh</span></div>
      <div class="strip-row"><span>All days</span><span>rain/overcast</span></div>
    </div>
  </div>

  <!-- Refresh -->
  <button id="refreshBtn" onclick="fetchForecast()">☀ Load Forecast</button>

  <!-- Error -->
  <div id="errorBox"></div>

  <!-- Day strip -->
  <div id="dayStrip"></div>

  <!-- Day detail -->
  <div id="dayDetail"></div>

  <div class="footer">Data: Open-Meteo (BOM + ECMWF) · Free, no API key</div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────
const LAT          = -33.9441;
const LON          = 150.9991;
const SYSTEM_KW    = 5.28;
const TEMP_COEFF   = -0.0026;
const EFFECTIVE_PR = 0.509;   // 0.62 orientation × 0.82 system PR (calibrated)

const API = `https://api.open-meteo.com/v1/forecast`
  + `?latitude=${LAT}&longitude=${LON}`
  + `&daily=sunrise,sunset,temperature_2m_max,shortwave_radiation_sum,cloud_cover_mean,precipitation_sum,weathercode`
  + `&hourly=shortwave_radiation,direct_radiation,diffuse_radiation`
  + `&timezone=Australia%2FSydney`
  + `&forecast_days=7`;

const RC = {
  Excellent: { text:'#4ADE80', bg:'rgba(74,222,128,0.12)',  border:'rgba(74,222,128,0.25)' },
  Good:      { text:'#FFB830', bg:'rgba(255,184,48,0.12)',  border:'rgba(255,184,48,0.25)' },
  Fair:      { text:'#FB923C', bg:'rgba(251,146,60,0.12)',  border:'rgba(251,146,60,0.25)' },
  Poor:      { text:'#F87171', bg:'rgba(248,113,113,0.12)', border:'rgba(248,113,113,0.25)' },
};

const WMO = (c) => {
  if (c===0)    return ['Sunny','☀️'];
  if (c<=2)     return ['Partly Cloudy','⛅'];
  if (c===3)    return ['Overcast','☁️'];
  if (c<=49)    return ['Foggy','🌫️'];
  if (c<=59)    return ['Drizzle','🌦️'];
  if (c<=69)    return ['Rainy','🌧️'];
  if (c<=79)    return ['Snowy','❄️'];
  if (c<=84)    return ['Showers','🌧️'];
  return ['Stormy','⛈️'];
};

// ── Calculations ───────────────────────────────────────────────────
function calcDay(radMJ, maxTemp) {
  const psh = (radMJ / 3.6) * 0.62; // south-facing: 62% of north-facing PSH
  let kwh = psh * SYSTEM_KW * EFFECTIVE_PR;
  if (maxTemp > 25) kwh *= (1 + TEMP_COEFF * (maxTemp - 25));
  kwh = Math.max(0, kwh);
  const r = kwh>=7 ? ['Excellent',92] : kwh>=5 ? ['Good',68] : kwh>=3 ? ['Fair',42] : ['Poor',18];
  return { psh: psh.toFixed(1), kwh: kwh.toFixed(1), rating: r[0], rPct: r[1] };
}

function adjHourly(dir, dif) {
  // South-facing: diffuse unaffected (~85%), direct heavily penalised
  // Simple noon-weighted direct penalty
  return Math.round(dir * 0.25 + dif * 0.85);
}

function fmtTime(str) {
  if (!str) return '—';
  const t = (str.split('T')[1]||'').split(':');
  const h = parseInt(t[0]), m = parseInt(t[1]);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;
}

function fmtDate(str, i) {
  const [y,mo,d] = str.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  return {
    short: dt.toLocaleDateString('en-AU',{weekday:'short'}),
    full:  dt.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'})
  };
}

function hourLabel(h) {
  if (h===0||h===24) return '12a';
  if (h<12)  return h+'a';
  if (h===12) return '12p';
  return (h-12)+'p';
}

// ── State ──────────────────────────────────────────────────────────
let DAYS = [];
let SELECTED = 0;

// ── Fetch ──────────────────────────────────────────────────────────
async function fetchForecast() {
  const btn = document.getElementById('refreshBtn');
  const err = document.getElementById('errorBox');
  btn.disabled = true;
  btn.innerHTML = '<span class="dot" style="animation-delay:0ms"></span><span class="dot" style="animation-delay:120ms"></span><span class="dot" style="animation-delay:240ms"></span> Loading…';
  err.style.display = 'none';

  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();
    const { daily, hourly } = data;

    DAYS = [];
    for (let i = 0; i < daily.time.length; i++) {
      const { short, full } = fmtDate(daily.time[i], i);
      const radMJ   = daily.shortwave_radiation_sum[i] ?? 0;
      const maxTemp = daily.temperature_2m_max[i] ?? 20;
      const { psh, kwh, rating, rPct } = calcDay(radMJ, maxTemp);
      const [condition, icon] = WMO(daily.weathercode[i] ?? 0);
      const precip = (daily.precipitation_sum[i] ?? 0).toFixed(1);
      const cloud  = Math.round(daily.cloud_cover_mean[i] ?? 0);

      // Hourly 6am–6pm
      const hourlyData = [];
      for (let h = 6; h <= 18; h++) {
        const idx = i * 24 + h;
        const dir = hourly.direct_radiation[idx]    ?? 0;
        const dif = hourly.diffuse_radiation[idx]   ?? 0;
        hourlyData.push({ label: hourLabel(h), wm2: adjHourly(dir, dif) });
      }

      DAYS.push({ short, full, psh, kwh, rating, rPct, condition, icon, precip, cloud,
        sunrise: fmtTime(daily.sunrise[i]),
        sunset:  fmtTime(daily.sunset[i]),
        maxTemp: Math.round(maxTemp),
        hourly: hourlyData
      });
    }

    renderStrip();
    selectDay(0);

    const now = new Date();
    btn.innerHTML = `↺ Refresh · Updated ${now.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})}`;

  } catch(e) {
    err.textContent = '⚠ ' + e.message + ' — make sure you\'re running via a local server (see instructions).';
    err.style.display = 'block';
    btn.innerHTML = '☀ Retry';
  } finally {
    btn.disabled = false;
  }
}

// ── Render ─────────────────────────────────────────────────────────
function renderStrip() {
  const strip = document.getElementById('dayStrip');
  strip.style.display = 'grid';
  strip.innerHTML = DAYS.map((d,i) => {
    const rc = RC[d.rating];
    return `<button class="day-btn" onclick="selectDay(${i})" id="daybtn-${i}">
      <div class="db-name">${d.short}</div>
      <div class="db-icon">${d.icon}</div>
      <div class="db-kwh">${d.kwh}</div>
      <div class="db-unit">kWh</div>
    </button>`;
  }).join('');
}

function selectDay(i) {
  SELECTED = i;
  // Update strip active state
  DAYS.forEach((_,j) => {
    const btn = document.getElementById(`daybtn-${j}`);
    if (!btn) return;
    const rc = RC[DAYS[j].rating];
    if (j === i) {
      btn.style.background = rc.bg;
      btn.style.border = `1px solid ${rc.border}`;
      btn.querySelector('.db-name').style.color = rc.text;
      btn.querySelector('.db-kwh').style.color  = rc.text;
    } else {
      btn.style.background = 'rgba(255,255,255,0.03)';
      btn.style.border = '1px solid rgba(255,255,255,0.06)';
      btn.querySelector('.db-name').style.color = 'var(--dim2)';
      btn.querySelector('.db-kwh').style.color  = '#7a90b0';
    }
  });
  renderDetail(DAYS[i], i);
}

function renderDetail(d, i) {
  const rc    = RC[d.rating];
  const maxWm = Math.max(...d.hourly.map(h=>h.wm2), 1);
  const when  = i===0?'Today':i===1?'Tomorrow':'Forecast';

  const bars = d.hourly.map((h,hi) => {
    const pct = (h.wm2/maxWm)*100;
    const lit = h.wm2>60;
    const bg  = lit ? 'linear-gradient(to top,#FF8000,#FFE566)' : 'rgba(255,184,48,0.15)';
    const shadow = lit ? '0 -2px 6px rgba(255,184,48,0.3)' : 'none';
    return `<div class="chart-col">
      <div class="chart-bar" title="${h.label}: ${h.wm2} W/m²"
        style="height:${Math.max(pct,2)}%;background:${bg};box-shadow:${shadow};animation-delay:${hi*28}ms"></div>
      <div class="chart-time">${h.label}</div>
    </div>`;
  }).join('');

  const detail = document.getElementById('dayDetail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <div class="banner">
      <div>
        <div class="banner-label">${when}</div>
        <div class="banner-date">${d.full}</div>
      </div>
      <div class="banner-right">
        <div class="banner-icon">${d.icon}</div>
        <div class="banner-cond">${d.condition}</div>
        ${parseFloat(d.precip)>0 ? `<div class="banner-rain">🌧 ${d.precip}mm</div>` : ''}
      </div>
    </div>

    <div class="big-stats">
      <div class="card big-stat">
        <div class="big-stat-icon">☀️</div>
        <div class="big-stat-label">Peak Sun Hours</div>
        <div class="big-stat-val col-sun">${d.psh}</div>
        <div class="big-stat-unit">hrs · south-facing adj.</div>
      </div>
      <div class="card big-stat">
        <div class="big-stat-icon">⚡</div>
        <div class="big-stat-label">Est. Output</div>
        <div class="big-stat-val col-acc">${d.kwh}</div>
        <div class="big-stat-unit">kWh generated</div>
      </div>
    </div>

    <div class="card rating-card">
      <div class="rating-head">
        <div class="rating-lbl">Solar Potential</div>
        <div class="rating-badge" style="color:${rc.text};background:${rc.bg};border:1px solid ${rc.border}">${d.rating}</div>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:0%;background:linear-gradient(to right,${rc.text},${rc.text}88)"></div>
      </div>
    </div>

    <div class="card hourly-card">
      <div class="hourly-lbl">Irradiance — south-facing adjusted (W/m²)</div>
      <div class="chart">${bars}</div>
    </div>

    <div class="details">
      <div class="card detail-item"><span class="detail-icon">🌅</span><div><div class="detail-lbl">Sunrise</div><div class="detail-val">${d.sunrise}</div></div></div>
      <div class="card detail-item"><span class="detail-icon">🌇</span><div><div class="detail-lbl">Sunset</div><div class="detail-val">${d.sunset}</div></div></div>
      <div class="card detail-item"><span class="detail-icon">🌡️</span><div><div class="detail-lbl">Max Temp</div><div class="detail-val">${d.maxTemp} °C</div></div></div>
      <div class="card detail-item"><span class="detail-icon">☁️</span><div><div class="detail-lbl">Cloud Cover</div><div class="detail-val">${d.cloud}%</div></div></div>
    </div>
  `;

  // Animate rating bar after paint
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const bar = detail.querySelector('.bar-fill');
      if (bar) bar.style.width = d.rPct + '%';
    });
  });
}
</script>
</body>
</html>
